<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>OutSystems UI Tokens</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#105cef;--primary-subtle:#e9ecfc;
  --surface:#ffffff;--surface-hover:#f3f3f3;
  --border:#ebebeb;--border-input:#d5d5d5;
  --text:#242424;--text-subtle:#626262;--text-subtlest:#a2a2a2;
  --danger:#e52929;
  --radius:8px;--radius-sm:4px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{font-family:var(--font);background:#fafafa;color:var(--text);font-size:13px;line-height:1.5}

/* Header */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.header-title{font-size:13px;font-weight:600;white-space:nowrap;color:var(--text)}
.header-controls{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}

/* Search */
.search-wrap{position:relative;flex:1;min-width:160px;max-width:320px}
.search-wrap svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-subtlest);pointer-events:none}
#search{
  width:100%;padding:5px 8px 5px 28px;
  border:1px solid var(--border-input);border-radius:var(--radius-sm);
  font:inherit;font-size:12px;background:var(--surface);color:var(--text);
  outline:none;transition:border-color .1s;
}
#search:focus{border-color:var(--primary)}
#search-count{font-size:11px;color:var(--text-subtlest);white-space:nowrap;display:none}

/* Buttons */
.btn{
  padding:5px 12px;border-radius:var(--radius-sm);font:inherit;font-size:12px;
  cursor:pointer;border:1px solid var(--border-input);background:var(--surface);
  color:var(--text-subtle);transition:.1s;white-space:nowrap;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}

/* View Toggle */
.view-toggle{display:flex;border:1px solid var(--border-input);border-radius:var(--radius-sm);overflow:hidden}
.view-btn{
  padding:5px 12px;font:inherit;font-size:12px;cursor:pointer;
  border:none;background:var(--surface);color:var(--text-subtle);transition:.1s;white-space:nowrap;
}
.view-btn+.view-btn{border-left:1px solid var(--border-input)}
.view-btn.active{background:var(--primary-subtle);color:var(--primary);font-weight:600}

/* Tree */
main{margin-top:53px;padding:16px 20px;max-width:1100px}

.tree{list-style:none;padding:0}
.tree-root{padding-top:4px}

.tree-node{margin:1px 0}
.tree-children{
  list-style:none;padding-left:18px;
  border-left:1px solid var(--border);margin-left:6px;
  display:none;
}
.tree-children.open{display:block}

.node-row{
  display:flex;align-items:flex-start;gap:6px;padding:3px 6px;
  border-radius:var(--radius-sm);cursor:default;
  transition:background .1s;
}
.node-row.clickable{cursor:pointer}
.node-row.clickable:hover{background:var(--surface-hover)}
.node-row.hidden{display:none}
.node-row.match{background:var(--primary-subtle)!important}

/* Toggle arrow */
.toggle{
  flex-shrink:0;width:14px;height:18px;display:flex;align-items:center;justify-content:center;
  color:var(--text-subtlest);font-size:9px;margin-top:1px;
  transition:transform .15s;
}
.toggle.open{transform:rotate(90deg)}
.toggle-spacer{width:14px;flex-shrink:0}

/* Node icons */
.node-icon{font-size:11px;flex-shrink:0;margin-top:1px;line-height:18px}

/* Node label */
.node-label{flex:1;min-width:0}
.node-label .name{font-weight:500;color:var(--text)}
.node-label .detail{color:var(--text-subtle);font-size:12px}
.node-label .token-name{
  font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
  font-size:11px;color:#7c3aed;background:#f5f0ff;
  padding:1px 4px;border-radius:3px;display:inline-block;
}
.node-label .value-badge{
  font-size:11px;font-weight:600;color:var(--text);
  background:var(--surface-hover);padding:1px 6px;
  border-radius:3px;display:inline-block;margin-right:4px;
}
.node-label .color-dot{
  display:inline-block;width:10px;height:10px;
  border-radius:50%;border:1px solid rgba(0,0,0,.1);
  margin-right:4px;vertical-align:middle;flex-shrink:0;
}

/* Level styles */
.level-0 .name{font-size:15px;font-weight:700;color:var(--primary)}
.level-1 .name{font-size:13px;font-weight:600;color:var(--text)}
.level-2 .name{font-size:13px;font-weight:600}
.level-3 .name{font-size:12px;font-weight:500;color:var(--text-subtle)}
.level-4 .name{font-size:12px;font-weight:400}
.level-5 .name{font-size:12px;color:var(--text-subtle)}

/* Component Vars Table */
.vars-table-wrap{padding:4px 0 4px 20px}
table.vars-table{
  width:100%;border-collapse:collapse;
  font-size:11px;margin:4px 0;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  overflow:hidden;
}
.vars-table th{
  text-align:left;padding:5px 10px;
  background:var(--surface-hover);color:var(--text-subtle);
  font-weight:600;border-bottom:1px solid var(--border);
}
.vars-table td{padding:4px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.vars-table tr:last-child td{border-bottom:none}
.vars-table tr:hover td{background:var(--primary-subtle)}
.vars-table .var-name{
  font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
  color:var(--primary);font-size:11px;
}
.vars-table .var-maps{
  font-family:'SF Mono',Monaco,'Cascadia Code',monospace;
  color:#7c3aed;font-size:11px;
}
.vars-table .var-val{color:var(--text-subtle)}

/* Highlight */
mark{background:#fef08a;color:inherit;padding:0 1px;border-radius:2px}

/* Empty state */
.empty{padding:40px;text-align:center;color:var(--text-subtlest)}
</style>
</head>
<body>

<header>
  <span class="header-title">OutSystems UI Tokens</span>
  <div class="header-controls">
    <div class="search-wrap">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.868-3.833zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
      </svg>
      <input id="search" type="text" placeholder="Search component or token…" autocomplete="off"/>
    </div>
    <span id="search-count"></span>
    <button class="btn" id="btn-collapse">Collapse all</button>
    <button class="btn" id="btn-expand">Expand all</button>
    <div class="view-toggle">
      <button class="view-btn active" data-view="component">By Component</button>
      <button class="view-btn" data-view="token">By Token</button>
    </div>
  </div>
</header>

<main>
  <ul class="tree tree-root" id="tree"></ul>
</main>

function buildTokenViewData() {
  // Collect all token→usages
  const map = {};
  COMPONENTS.forEach(comp => {
    Object.entries(comp.props).forEach(([cat, items]) => {
      items.forEach(item => {
        if (!item.token || item.token === '—') return;
        if (!map[item.token]) map[item.token] = {value: item.value, usages: []};
        // Avoid duplicate (same token used twice in same component)
        if (!map[item.token].usages.find(u => u.comp === comp.name && u.prop === item.label)) {
          map[item.token].usages.push({comp: comp.name, prop: item.label, cat});
        }
      });
    });
  });
  return map;
}

// ─── TREE BUILDER ──────────────────────────────────────────────────────────────

function buildComponentTree() {
  const root = {label:'OutSystems UI Tokens', icon:'🎨', level:0, children:[]};
  GROUPS.forEach(group => {
    const comps = COMPONENTS.filter(c => c.group === group);
    if (!comps.length) return;
    const groupNode = {label: group, icon: groupIcon(group), level:1, children:[]};
    comps.forEach(comp => {
      const compNode = {label: comp.name, icon:'▪', level:2, id: comp.id, children:[]};
      // Property categories
      Object.entries(comp.props).forEach(([cat, items]) => {
        const catNode = {label: cat, icon: catIcon(cat), level:3, category: cat, children:[]};
        items.forEach(item => {
          catNode.children.push({
            label: item.label,
            value: item.value,
            token: item.token,
            level:4,
            type:'property',
          });
        });
        compNode.children.push(catNode);
      });
      // Component vars table
      if (comp.vars && comp.vars.length) {
        compNode.children.push({
          label: 'Component Variables',
          icon: '⚙️',
          level:3,
          type:'vars-table',
          vars: comp.vars,
        });
      }
      groupNode.children.push(compNode);
    });
    root.children.push(groupNode);
  });
  return root;
}

function buildTokenTree() {
  const usageMap = buildTokenViewData();
  const root = {label:'OutSystems UI Tokens', icon:'🎨', level:0, children:[]};

  Object.entries(TOKEN_CATEGORIES).forEach(([catName, subcats]) => {
    const catNode = {label: catName, icon: catIcon(catName), level:1, children:[]};

    Object.entries(subcats).forEach(([subName, tokens]) => {
      const subNode = {label: subName, level:2, children:[]};
      tokens.forEach(tok => {
        const info = usageMap[tok];
        if (!info || !info.usages.length) return; // skip unused tokens
        const val = TOKEN_VALUES[tok] || '—';
        const tokNode = {
          label: tok,
          value: val,
          level:3,
          type:'token',
          children: info.usages.map(u => ({
            label: u.comp,
            detail: u.prop,
            level:4,
            type:'usage',
          })),
        };
        subNode.children.push(tokNode);
      });
      if (subNode.children.length) catNode.children.push(subNode);
    });
    if (catNode.children.length) root.children.push(catNode);
  });
  return root;
}

function groupIcon(g) {
  return {
    'Form Controls':'📝','Actions':'⚡','Navigation':'🧭',
    'Feedback':'💬','Overlays':'🪟','Content':'📦',
  }[g] || '📁';
}
function catIcon(c) {
  return {
    'Dimensions':'📐','Text':'🔤','Colors':'🎨','Border':'🔲',
    'Motion':'✨','Elevation':'🌤','Typography':'🔤',
    'Spacing':'📏','Color':'🎨','Elevation':'🌤',
    'Motion':'✨','Component Variables':'⚙️',
  }[c] || '▸';
}

// ─── RENDERING ──────────────────────────────────────────────────────────────────

let currentView = 'component';

function isColorValue(v) {
  return v && (v.startsWith('#') || v.startsWith('rgb') || v.startsWith('rgba'));
}

function renderNode(node, searchQuery) {
  const li = document.createElement('li');
  li.className = 'tree-node';

  // vars-table node
  if (node.type === 'vars-table') {
    const row = document.createElement('div');
    row.className = 'node-row clickable';
    row.innerHTML = `<span class="toggle-spacer"></span><span class="node-icon">⚙️</span><span class="node-label"><span class="name level-3">Component Variables</span></span>`;
    const wrap = document.createElement('div');
    wrap.className = 'vars-table-wrap';
    wrap.style.display = 'none';
    const tbl = document.createElement('table');
    tbl.className = 'vars-table';
    tbl.innerHTML = `<thead><tr><th>Variable</th><th>Maps to</th><th>Resolved value</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    node.vars.forEach(v => {
      const tr = document.createElement('tr');
      const colorDot = isColorValue(v.resolved) ? `<span class="color-dot" style="background:${v.resolved}"></span>` : '';
      tr.innerHTML = `<td class="var-name">${v.name}</td><td class="var-maps">${v.mapsTo}</td><td class="var-val">${colorDot}${v.resolved}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    row.addEventListener('click', () => {
      const open = wrap.style.display !== 'none';
      wrap.style.display = open ? 'none' : 'block';
      row.querySelector('.toggle') && (row.querySelector('.toggle').style.transform = open ? '' : 'rotate(90deg)');
    });
    li.appendChild(row);
    li.appendChild(wrap);
    return li;
  }

  const hasChildren = node.children && node.children.length > 0;
  const row = document.createElement('div');
  row.className = 'node-row' + (hasChildren ? ' clickable' : '');
  row.dataset.label = (node.label + ' ' + (node.token||'') + ' ' + (node.value||'')).toLowerCase();

  // Toggle
  if (hasChildren) {
    const toggle = document.createElement('span');
    toggle.className = 'toggle';
    toggle.textContent = '▶';
    row.appendChild(toggle);
  } else {
    const sp = document.createElement('span');
    sp.className = 'toggle-spacer';
    row.appendChild(sp);
  }

  // Icon
  if (node.icon) {
    const ic = document.createElement('span');
    ic.className = 'node-icon';
    ic.textContent = node.icon;
    row.appendChild(ic);
  }

  // Label
  const lbl = document.createElement('span');
  lbl.className = `node-label level-${node.level}`;

  if (node.type === 'property') {
    const colorDot = isColorValue(node.value) ? `<span class="color-dot" style="background:${node.value}"></span>` : '';
    lbl.innerHTML = `<span class="name">${hl(node.label, searchQuery)}</span> <span class="detail">→ <span class="value-badge">${colorDot}${node.value}</span><span class="token-name">${hl(node.token||'', searchQuery)}</span></span>`;
  } else if (node.type === 'token') {
    const colorDot = isColorValue(node.value) ? `<span class="color-dot" style="background:${node.value}"></span>` : '';
    lbl.innerHTML = `<span class="token-name">${hl(node.label, searchQuery)}</span> <span class="detail"><span class="value-badge">${colorDot}${node.value}</span></span>`;
  } else if (node.type === 'usage') {
    lbl.innerHTML = `<span class="name">${hl(node.label, searchQuery)}</span> <span class="detail">— ${node.detail}</span>`;
  } else {
    lbl.innerHTML = `<span class="name">${hl(node.label, searchQuery)}</span>`;
  }
  row.appendChild(lbl);

  li.appendChild(row);

  // Children
  if (hasChildren) {
    const ul = document.createElement('ul');
    ul.className = 'tree-children';
    node.children.forEach(child => ul.appendChild(renderNode(child, searchQuery)));
    li.appendChild(ul);

    row.addEventListener('click', () => {
      const isOpen = ul.classList.contains('open');
      ul.classList.toggle('open', !isOpen);
      row.querySelector('.toggle').classList.toggle('open', !isOpen);
    });
  }

  return li;
}

function hl(text, query) {
  if (!query || !text) return text;
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

// ─── SEARCH ────────────────────────────────────────────────────────────────────

let searchTimeout;
function getAncestorRow(rowEl) {
  // Walk up: rowEl → li.tree-node → ul.tree-children → li.tree-node (ancestor)
  let el = rowEl.parentElement; // li.tree-node
  while (el) {
    el = el.parentElement; // ul.tree-children
    if (!el) break;
    el = el.parentElement; // li.tree-node ancestor
    if (!el) break;
    const row = el.querySelector(':scope > .node-row');
    if (row) return row;
  }
  return null;
}

function hasMatchingAncestor(rowEl) {
  let el = rowEl.parentElement; // li.tree-node
  while (el) {
    el = el.parentElement; // ul.tree-children
    if (!el) break;
    el = el.parentElement; // li.tree-node ancestor
    if (!el) break;
    const row = el.querySelector(':scope > .node-row');
    if (row && row.classList.contains('match')) return true;
  }
  return false;
}

function applySearch(query) {
  const q = query.trim().toLowerCase();
  const allRows = document.querySelectorAll('.node-row');
  const countEl = document.getElementById('search-count');

  if (!q) {
    allRows.forEach(r => r.classList.remove('hidden','match'));
    document.querySelectorAll('.tree-children').forEach(ul => ul.classList.remove('open'));
    document.querySelectorAll('.toggle').forEach(t => t.classList.remove('open'));
    countEl.style.display = 'none';
    return;
  }

  let matches = 0;

  // Pass 1 — mark direct matches
  allRows.forEach(r => {
    const txt = (r.dataset.label || '').toLowerCase();
    if (txt.includes(q)) {
      r.classList.add('match');
      r.classList.remove('hidden');
      matches++;
    } else {
      r.classList.remove('match');
    }
  });

  // Pass 2 — open ancestors of matches + open children of matches
  allRows.forEach(r => {
    if (!r.classList.contains('match')) return;

    // Open all ancestor tree-children
    let el = r.parentElement;
    while (el) {
      if (el.classList.contains('tree-children')) {
        el.classList.add('open');
        const parentRow = el.previousElementSibling;
        if (parentRow?.classList.contains('node-row')) {
          parentRow.querySelector('.toggle')?.classList.add('open');
        }
      }
      el = el.parentElement;
    }

    // Also open this match's own children so they're explorable
    const ownChildren = r.parentElement?.querySelector(':scope > .tree-children');
    if (ownChildren) {
      ownChildren.classList.add('open');
      r.querySelector('.toggle')?.classList.add('open');
    }
  });

  // Pass 3 — show/hide non-matching rows
  allRows.forEach(r => {
    if (r.classList.contains('match')) return;

    // If any ancestor is a match, keep this row visible (child of a result)
    if (hasMatchingAncestor(r)) {
      r.classList.remove('hidden');
      return;
    }

    // Otherwise, show only if it has matching descendants
    const li = r.parentElement;
    const children = li?.querySelector(':scope > .tree-children');
    const hasMatchingDescendant = children && children.querySelector('.match');
    r.classList.toggle('hidden', !hasMatchingDescendant);
  });

  countEl.style.display = 'inline';
  countEl.textContent = `${matches} result${matches !== 1 ? 's' : ''}`;
}

// ─── RENDER TREE ──────────────────────────────────────────────────────────────

function renderTree(view, searchQuery = '') {
  const treeEl = document.getElementById('tree');
  treeEl.innerHTML = '';
  const data = view === 'component' ? buildComponentTree() : buildTokenTree();
  const rootLi = renderNode(data, searchQuery);
  // Auto-open root and first level
  const rootChildren = rootLi.querySelector('.tree-children');
  if (rootChildren) rootChildren.classList.add('open');
  rootLi.querySelector('.toggle')?.classList.add('open');
  treeEl.appendChild(rootLi);
}

document.getElementById('btn-collapse').addEventListener('click', () => {
  document.querySelectorAll('.tree-children').forEach(ul => ul.classList.remove('open'));
  document.querySelectorAll('.toggle').forEach(t => t.classList.remove('open'));
  // Keep root open
  const root = document.querySelector('#tree > .tree-node > .tree-children');
  if (root) {
    root.classList.add('open');
    root.previousElementSibling?.querySelector('.toggle')?.classList.add('open');
  }
});

document.getElementById('btn-expand').addEventListener('click', () => {
  document.querySelectorAll('.tree-children').forEach(ul => ul.classList.add('open'));
  document.querySelectorAll('.toggle').forEach(t => t.classList.add('open'));
});

document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    const q = e.target.value.trim();
    if (q.length > 1) {
      // Re-render with highlights then apply visibility
      renderTree(currentView, q);
      applySearch(q);
    } else {
      renderTree(currentView);
    }
  }, 200);
});

// ─── INIT ──────────────────────────────────────────────────────────────────────
renderTree('component');
</script>
